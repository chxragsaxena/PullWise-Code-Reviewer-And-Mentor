# A skill packages what to check (this file) and what to teach (lessons/*.md).
id: go
name: Go
version: 1
languages: [go]          # skill is selected only if the PR changes files in these languages
description: >
  Idiomatic Go: error handling, context propagation and concurrency safety.
  Interface design lives in the solid skill (Interface Segregation), since
  it's the same question either way.

# kind: deterministic (analyzer: goast|semgrep|treesitter|metric) or ai; lesson = file in lessons/
checks:
  - id: ignored-error
    title: Error return value is ignored
    kind: deterministic
    analyzer: goast
    severity: high
    lesson: error-handling

  - id: context-not-first
    title: context.Context is not the first parameter
    kind: deterministic
    analyzer: goast
    severity: medium
    lesson: context

  - id: http-call-without-context
    title: HTTP or database call made without a context
    kind: deterministic
    analyzer: goast
    severity: medium
    lesson: context

  - id: high-complexity
    title: Function has high cyclomatic complexity
    kind: deterministic
    analyzer: metric
    threshold: 15
    severity: medium
    lesson: error-handling

  - id: goroutine-leak-risk
    title: Goroutine started with no way to stop or wait for it
    kind: ai
    severity: high
    lesson: concurrency
