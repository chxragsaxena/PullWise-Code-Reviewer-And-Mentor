# Run: docker compose -f docker-compose.prod.yml up -d --build  (needs .env; POSTGRES_PASSWORD required)

# Own project name so this stack never collides with the dev compose file's database.
name: pullwise

services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pullwise}
      POSTGRES_DB: ${POSTGRES_DB:-pullwise}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      # Overrides .env: here the database host is "db" (URL-encode special characters in the password).
      DATABASE_URL: postgres://${POSTGRES_USER:-pullwise}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-pullwise}?sslmode=disable
      ADDR: ":8080"
      FRONTEND_URL: ${PUBLIC_URL:-http://localhost:8080}
      GITHUB_OAUTH_REDIRECT_URL: ${PUBLIC_URL:-http://localhost:8080}/auth/github/callback
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - backend

volumes:
  pgdata:
