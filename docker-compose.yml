# Local development services. Start with:  docker compose up -d db
# To wipe the database and start fresh:    docker compose down -v
# Requires a .env file next to this one (copy .env.example and set a password).

services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pullwise}
      POSTGRES_DB: ${POSTGRES_DB:-pullwise}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)}
    ports:
      # Bound to localhost only, so the database is not reachable from the network.
      - "127.0.0.1:5432:5432"
    volumes:
      # postgres:18 keeps its data under /var/lib/postgresql/18/, so mount the parent.
      - pgdata:/var/lib/postgresql
      # No migrations are mounted here: the backend applies backend/migrations itself
      # at startup (tracked in the schema_migrations table).
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
