server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # API and GitHub login live on the backend; one origin keeps the cookie same-site, no CORS.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Review progress is a long-lived Server-Sent Events stream.
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    location /auth/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Single-page app: unknown paths serve index.html for the React router.
    location / {
        try_files $uri /index.html;
    }
}
