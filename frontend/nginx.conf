server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # The API and the GitHub login routes live on the Go backend. Serving
    # everything from one origin keeps the session cookie same-site and
    # means no CORS configuration is needed.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Review progress is a long-lived Server-Sent Events stream.
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    location /auth/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Single-page app: unknown paths (e.g. /reviews/7) serve index.html and the
    # React router takes over.
    location / {
        try_files $uri /index.html;
    }
}
